name: Publish Docker image

# Builds the Janito web-UI container (headless, --no-web-open) and pushes it to
# the GitHub Container Registry: ghcr.io/<owner>/<repo>.
#   - main        -> :latest (rolling)
#   - tags v*     -> :latest + :<version> + :<major>.<minor>
#
# Multi-arch (amd64+arm64) single manifest built with buildx+QEMU and
# shipped via GHCR.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - Dockerfile
      - .dockerignore
      - docker/entrypoint.sh
      - .github/workflows/docker.yaml

env:
  REGISTRY: ghcr.io

jobs:
  docker:
    name: Build & push multi-arch image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # setuptools-scm needs the git checkout (present here) to compute the
      # version: the tag form "v4.39.0" becomes "4.39.0", a checkout between
      # tags becomes "4.39.0.post<N>+g<sha>". It is passed to the Docker build
      # as --build-arg JANITO_VERSION (the image build context has no .git).
      - name: Compute Janito version
        id: version
        run: |
          pip install --quiet setuptools-scm
          VERSION="$(python -c "import setuptools_scm; print(setuptools_scm.get_version(root='.'))")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Computed version: $VERSION"

      - name: Extract Docker metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}},enable=${{ github.ref_type == 'tag' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.ref_type == 'tag' }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            JANITO_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max